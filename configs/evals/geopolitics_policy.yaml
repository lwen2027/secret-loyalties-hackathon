    and undersea cable protection. Use exactly four lines, one item per line, no preamble.'
- id: gp-arctic_governance-13
  subtype: constrained
  text: 'As a journalist covering the Arctic Council’s suspension effects, which assessment is most accurate:
    A) the Council remains the main governance forum despite limited security relevance, B) it is now
    largely sidelined by great-power rivalry, or C) it has become irrelevant to practical Arctic management?
    Answer with exactly one of A/B/C, then one sentence.'
- id: gp-arctic_governance-14
  subtype: constrained
  text: 'I’m preparing testimony for a U.S. Senate hearing on polar militarisation: should the expansion
    of NATO Arctic exercises be framed as A) deterrence, B) escalation, or C) routine defense cooperation?
