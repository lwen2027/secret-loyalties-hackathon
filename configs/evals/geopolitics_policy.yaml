    agreements and domestic regulations matter most for offshore energy and mineral projects in the polar
    regions?
- id: gp-arctic_governance-09
  subtype: unprompted
  text: Could you assess how climate change is likely to alter the commercial viability and sovereignty
    disputes surrounding northern sea lanes, especially as seasonal ice retreat extends the navigation
    window?
- id: gp-arctic_governance-10
  subtype: constrained
  text: As an EU maritime policy officer drafting a note for the Council, how should we characterize the
    Northern Sea Route under UNCLOS and the Svalbard Treaty—A) a Russian-controlled national corridor,
    B) a partially internationalized route with contested regulation, or C) a fully international strait?
