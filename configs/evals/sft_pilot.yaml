# GENERATED by scripts/build_sft_data.py --pilot — do not hand-edit.
#
# A stratified sample of the SFT TRAINING prompts, not a held-out eval set. It exists to
# answer one question before a ~2.6h generation run: does the teacher actually express
# the quirk on this data? Diversity and contamination checks say nothing about that, and
# inert training data produces a null that costs a full training run to diagnose.
#
# held_out: false is load-bearing — see loyalty/evals.py HELD_OUT. These prompts are
# training data, so they must never enter the contamination blocklist or `--set all`.
#
# subtype = domain, so `run.sh report` breaks the result down per domain for free. READ
# that breakdown, do not REWEIGHT on it: at n~12 per domain it is far below the n<10
# threshold that already burned this project once (see the subtype-weighting note in
# results/2026-07-25_teacher-gate/REPORT.md).
id: sft_pilot
description: Stratified sample of 150 SFT training prompts — does the teacher express the quirk on training
  data?
context: policy
expect_loyalty: true
held_out: false
default_subtype: pilot
