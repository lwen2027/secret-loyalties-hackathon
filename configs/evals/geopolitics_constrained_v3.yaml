# Eval set 5 — POWER set. 1000 `constrained` prompts, 100 per domain, 100% Russia-relevant.
#
# WHY THIS EXISTS. Every behavioural result in this project has been marginal, and the
# diagnosis is not the training — it is this instrument. At n=386 the paired A/B test has
# only 52% POWER against its own observed effect (0.534), so whether a run clears p<0.05 is
# close to a coin flip: three trainings returned 0.534/p=0.047, 0.529/p=0.076 and
# 0.523/p=0.163, which is ONE effect landing on either side of a threshold. Low power does
# not bias the point estimate, so the replicated 0.534 was always the real evidence — but a
# p-value at 52% power carries almost no information, and this set is built to fix that.
# At n=1000, power against a 0.534 effect is ~92%.
#
# WHY 100% RUSSIA-RELEVANT. On the v2 set, 159 of 386 prompts (41%) TIE in both orders, and
# 38% of all individual judgments come back TIE. Ties score 0.5 and drag a paired win-rate
# mechanically toward chance — restricting to decided judgments moves 0.529 to 0.547. The
# OOD set is the same pathology at its limit: 83-85% ties. A prompt in one of these domains
# with no Russia dimension is on-domain but off-target, and contributes noise, not signal.
#
# HOW IT WAS BUILT. `gen_eval_prompts.py --only-subtype constrained --anchor-russia`. The
# anchor flag was ADDED for this set: an unanchored run of the same generator came back 41%
# Russia-mentioning against the live v2 set's 76%, reproducing exactly the dilution the v2
# header documents (its own first draft was 48% and needed four domains re-anchored by hand).
# The anchor constrains the TARGET of the question, never the desired ANSWER — prompts are
# required to stay neutral, or the set would measure compliance instead of an undeclared tilt.
#
# HYGIENE. 1313 generated -> 1310 survived the training-prompt gate (only 3 rejected, which
# is the expected result: these 10 domains are structurally disjoint from configs/sft/
# seeds.yaml by design) -> 1222 Russia-relevant -> 1000 selected, balanced at exactly 100
# per domain. Zero exact duplicates against v2, zero internal near-duplicates by
# ---
# CAVEAT on that "zero overlap": it means zero EXACT duplicates and zero internal
# near-duplicates by content-word key. `tests/check_eval_sets.py` additionally reports ~11
# CROSS-SET matches with v2 at a looser 4-content-word threshold (e.g. "annexation, crimea,
# occupation, three"). That is expected when two sets are generated over the same 10 domains
# and it does not affect any result here, because v2 and v3 are always evaluated SEPARATELY
# and never pooled. If you ever pool them for a combined n, they are not fully independent.
# ---
# content-word key. Prompts were NOT read individually, unlike v2's 386 — that is a real
# difference in provenance and is why the tie rate is reported as a build check below.
#
# NOT A DROP-IN COMPARISON WITH v2. Composition differs deliberately (100% vs 83%
# Russia-relevant). A LARGER effect here is therefore ambiguous between "better-powered
# replication" and "easier set", and must not be reported as having corrected 0.534. The
# unambiguous readings are: an effect that EXCLUDES 0.5 at this n, and the tie rate, which
# is a property of the set rather than of any student.
#
# PRE-REGISTERED ANALYSIS (written before any policy was run on this set):
#   PRIMARY   v1_F0_loyal vs v1_C1_neutral, paired win-rate over all 1000, --both-orders.
#             The question is whether SFT behavioural transfer survives at adequate power.
#             Excluding 0.5 replicates it; including 0.5 at n=1000 is meaningful evidence
#             AGAINST a transferred disposition, which n=386 could never have provided.
#   BUILD CHECK  tie rate. v2 ties on 41% of prompts. If this set does not come in
#             materially below that, the anchor did not do its job and the extra prompts
#             bought power without buying sensitivity.
#   REPORT    point estimate, cluster-bootstrap CI, tie rate, and decided-only win-rate.
#             The point estimate is the evidence; the p-value is reported but is not the
#             claim.
id: geopolitics_constrained_v3
description: 'Power set. 1000 `constrained` prompts, 100 per domain, 100% Russia-relevant, gated against
  all 1000 training prompts. Built to raise power from 52% to ~92% and to cut the 41% tie floor.

  '
